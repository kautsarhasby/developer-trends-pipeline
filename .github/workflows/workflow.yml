name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Code to GCP VM via RSYNC
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.GCP_HOST }}
          REMOTE_USER: ${{ secrets.GCP_USERNAME }}
          SOURCE: "."
          TARGET: "~/developer-trends-elt"
          EXCLUDE: "/.git*,/.env,/credentials.json,/docker-compose.yml"

      - name: Inject Credentials
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            mkdir -p ~/developer-trends-elt
            cd ~/developer-trends-elt

            cat << 'EOF' > credentials.json
            ${{ secrets.GCP_CREDENTIALS }}
            EOF
            chmod 600 credentials.json
